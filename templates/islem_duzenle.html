{% extends "base.html" %}

{% block title %}İşlem Düzenle{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card-shadow">
            <div class="card-header bg-warning text-dark">
                <h4 class="mb-0">İşlemleri Düzenle</h4>
            </div>

            <div class="card-body">
                <form action="/islem-duzenle/{{ islem[0] }}" method="POST">

                    <div class="mb-3">
                        <label class="form-label text-muted fw-bold">Araç Seçin</label>
                        
                        <input class="form-control" list="arac-datalist" id="arac-secici" placeholder="-- Plaka veya Araç Yazın --" required autocomplete="off">

                        <input type="hidden" name="arac_id" id="gercek-arac-id" value="{{ islem[1] }}">

                        <datalist id="arac-datalist">
                            {% for arac in arac_listesi %}
                                <option data-value="{{ arac[0] }}" value="{{ arac[3] }} - {{ arac[1] }} {{ arac[2] }}"></option>
                            {% endfor %}
                        </datalist>

                        <div class="text-end mt-1">
                            <a href="/yeni-arac" class="text-decoration-none small text-warning">+ Yeni Araç Ekle</a>
                        </div>
                    </div>

                    <script>
                        document.addEventListener("DOMContentLoaded", function() {
                            var gercekIdInput = document.getElementById('gercek-arac-id');
                            var seciciInput = document.getElementById('arac-secici');
                            var secenekler = document.getElementById('arac-datalist').options;

                            if (gercekIdInput.value) {
                                for (var i = 0; i < secenekler.length; i++) {
                                    if (secenekler[i].getAttribute('data-value') == gercekIdInput.value) {
                                        seciciInput.value = secenekler[i].value;
                                        break;
                                    }
                                }
                            }

                            seciciInput.addEventListener('input', function(e) {
                                var secilenDeger = this.value;
                                for (var i = 0; i < secenekelr.length; i++) {
                                    if (secenekler[i].value === secilenDeger) {
                                        gercekIdInput.value = secenekler[i].getAttribute('data-value');
                                        return;
                                    }
                                }
                                gercekIdInput.value = '';
                            });
                        });
                    </script>

                    <div class="mb-3">
                        <label class="form-label text-muted fw-bold">İşlem Tarihi</label>
                        <input type="date" name="islem_tarihi" class="form-control" value="{{ islem[2] }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted fw-bold">Kilometre</label>
                        <input type="number" name="kilometre" class="form-control" value="{{ islem[3] }}" min="0" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted fw-bold">Lastik Tipi</label>
                        <input type="text" name="lastik_tipi" class="form-control" value="{{ islem[4] }}" placeholder="Örn: Yaz, Kış, Performans..." required autocomplete="off">
                    </div>


                    <button type="submit" class="btn btn-warning w-100 mb-2">İşlemi Kaydet</button>
                    <a href="/" class="btn btn-outline-secondary w-100">İptal ve Geri Dön</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

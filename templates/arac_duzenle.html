{% extends "base.html" %}

{% block title %}Araç Düzenle{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">

        <div class="card-shadow">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">Araç Bilgilerini Güncelle</h4>
            </div>

            <div class="card-body">
                <form action="/arac-duzenle/{{ arac[0] }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label text-muted fw-bold">Müşteri Seçin</label>
                        
                        <input class="form-control" list="musteri-datalist" id="musteri-secici" placeholder="-- Müşteri Adı Yazın --" required autocomplete="off">

                        <input type="hidden" name="musteri_id" id="gercek-musteri-id" value="{{ arac[4] }}">

                        <datalist id="musteri-datalist">
                            {% for musteri in musteri_listesi %}
                                <option data-value="{{ musteri[0] }}" value="{{ musteri[1] }} {{ musteri[2] }}"></option>
                            {% endfor %}
                        </datalist>

                        <div class="text-end mt-1">
                            <a href="/yeni-musteri" class="text-decoration-none small text-success">+ Yeni  Müşteri Ekle</a>
                        </div>
                    </div>

                    <script>
                        document.addEventListener("DOMContentLoaded", function() {
                            var gercekIdInput = document.getElementById('gercek-musteri-id');
                            var seciciInput = document.getElementById('musteri-secici');
                            var secenekler = document.getElementById('musteri-datalist').options;

                            if (gercekIdInput.value) {
                                for (var i = 0; i < secenekler.length; i++) {
                                    if (secenekler[i].getAttribute('data-value') == gercekIdInput.value) {
                                        seciciInput.value = secenekler[i].value;
                                        break;
                                    }
                                }
                            }
                        })
                    </script>
                    
                    <div class="mb-3">
                        <label class="form-label text-muted fw-bold">Marka</label>
                        <input type="text" name="marka" class="form-control" value="{{ arac[1] }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted fw-bold">Model</label>
                        <input type="text" name="model" class="form-control" value="{{ arac[2] }}" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted fw-bold">Plaka</label>
                        <input type="text" name="plaka" class="form-control" value="{{ arac[3] }}" required> 
                    </div>

                    <button type="submit" class="btn btn-success w-100 mb-2">Aracı Kaydet</button>
                    <a href="/" class="btn btn-outline-secondary w-100">İptal ve Geri Dön</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

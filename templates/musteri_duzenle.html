{% extends "base.html" %}

{% block title %} Müşteri Düzenle{% endblock %}

{% block content %}
<div class="row justify-content-center"> <div class="col-md-6"> <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Müşteri Bilgilerini Güncelle</h4>
            </div>
            
            <div class="card-body">
                <form action="/musteri-duzenle/{{ musteri[0] }}" method="POST">
                    
                    <div class="mb-3">
                        <label class="form-label text-muted fw-bold">İsim</label>
                        <input type="text" name="isim" class="form-control" value="{{ musteri[1] }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label text-muted fw-bold">Soyisim</label>
                        <input type="text" name="soyisim" class="form-control" value = "{{ musteri[2] }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted fw-bold">E-mail</label>
                        <input type="email" name="email" class="form-control" value = "{{ musteri[4] or '' }}" required>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label text-muted fw-bold">Telefon Numarası</label>
                        <input type="text" name="telefon" class="form-control" placeholder="05XX XXX XX XX" value="{{ musteri[3] }}" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 mb-2">Kaydet</button>
                    <a href="/" class="btn btn-outline-secondary w-100">İptal ve Geri Dön</a>
                    
                </form>
            </div>
        </div>

    </div>
</div>
{% endblock %}

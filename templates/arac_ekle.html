{% extends "base.html" %}

{% block title %}Yeni Araç Ekle{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card-shadow">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">Yeni Araç Kaydı</h4>
            </div>

            <div class="card-body">
                <form action="/yeni-arac" method="POST">
                    <div class="mb-3">
                        <label class="form-label text-muted fw-bold">Müşteri Seçin</label>
                        
                        <input class="form-control" list="musteri-datalist" id="musteri-secici" placeholder="-- Müşteri Adı Yazın --" required autocomplete="off">

                        <input type="hidden" name="musteri_id" id="gercek-musteri-id">

                        <datalist id="musteri-datalist">
                            {% for musteri in musteri_listesi %}
                                <option data-value="{{ musteri[0] }}" value="{{ musteri[1] }} {{ musteri[2] }}"></option>
                            {% endfor %}
                        </datalist>

                        <script>
                            document.getElementById('musteri-secici').addEventListener('input', function(e) {
                                var secilenDeger = this.value;
                                var secenekler = document.getElementById('musteri-datalist').options;

                                for (var i = 0; i < secenekler.length; i++) {
                                    if (secenekler[i].value === secilenDeger) {
                                        document.getElementById('gercek-musteri-id').value = secenekler[i].getAttribute('data-value');
                                        return;
                                    }
                                }
                                document.getElementById('gercek-musteri-id').value = '';
                            });
                        </script>

                        <div class="text-end mt-1">
                            <a href="/yeni-musteri" class="text-decoration-none small text-success">+ Yeni Müşteri Ekle</a>
                        </div>
                    </div>

                   <div class="mb-3">
                        <label class="form-label text-muted fw-bold">Marka</label>
                        <input type="text" name="marka" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted fw-bold">Model</label>
                        <input type="text" name="model" class="form-control" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted fw-bold">Plaka</label>
                        <input type="text" name="plaka" class="form-control" required> 
                    </div>

                    <button type="submit" class="btn btn-success w-100 mb-2">Aracı Kaydet</button>
                    <a href="/" class="btn btn-outline-secondary w-100">İptal ve Geri Dön</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
